name: anytime_travel
description: A Flutter travel application with GetX architecture
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=2.17.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management & Navigation
  get: ^4.6.0
  
  # Network
  dio: ^5.4.0
  
  # Local Storage
  get_storage: ^2.1.1
  
  # UI
  cupertino_icons: ^1.0.0
  flutter_svg: ^1.1.6
  intl_phone_field: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
