# GitHub Actions CI/CD for Anytime Trip
# Handles Backend (Go) and Frontend (Admin & Superadmin)

name: CI/CD Pipeline

# TRIGGERS: When should this workflow run?
on:
  push:
    branches: [main, develop, staging, ci-cd-saker]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      deploy_environment:
        description: 'Environment to deploy to'
        required: false
        type: choice
        options:
          - staging
          - production
      deploy_branch:
        description: 'Branch to deploy'
        required: false

# Repo-level permissions
permissions:
  contents: read

# JOBS: Independent units of work
jobs:

  # ── JOB 1: Backend (Go) ───────────────────────────────────────────────────
  backend:
    runs-on: ubuntu-latest
    name: Backend Tests & Build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        working-directory: ./backend
        run: go mod download

      - name: Verify dependencies
        working-directory: ./backend
        run: go mod verify

      - name: Run tests
        working-directory: ./backend
        run: go test -v ./...

      - name: Run linter
        working-directory: ./backend
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          golangci-lint run --timeout=5m

      - name: Build backend
        working-directory: ./backend
        run: go build -v -o bin/server main.go

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-binary
          path: backend/bin/server
          retention-days: 7

  # ── JOB 2: Frontend Admin ─────────────────────────────────────────────────
  frontend-admin:
    runs-on: ubuntu-latest
    name: Frontend Admin Build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/admin/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend/admin
        run: npm ci

      - name: Build CSS
        working-directory: ./frontend/admin
        run: npm run build:css

      - name: Upload admin build
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: frontend/admin/dist/
          retention-days: 7

  # ── JOB 3: Frontend Superadmin ────────────────────────────────────────────
  frontend-superadmin:
    runs-on: ubuntu-latest
    name: Frontend Superadmin Build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check structure
        working-directory: ./frontend/superadmin
        run: |
          echo "Superadmin structure validated"
          ls -la

  # ── JOB 4: Security Scan ──────────────────────────────────────────────────
  security-scan:
    runs-on: ubuntu-latest
    name: Security & Vulnerability Scan
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Go vulnerability check
        working-directory: ./backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

