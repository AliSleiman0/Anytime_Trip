# Anytime Trip CI/CD Pipeline
# Automated testing and integration pipeline for backend and frontend
# Author: Saker
# Last Updated: March 2026

name: CI/CD-Saker

# TRIGGERS: When should this workflow run?
on:
  push:
    branches: [main, develop, staging, ci-cd-saker]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      deploy_environment:
        description: 'Environment to deploy to'
        required: false
        type: choice
        options:
          - production
          - rollback
      deploy_branch:
        description: 'Branch to deploy'
        required: false

# Repo-level permissions
permissions:
  contents: read
  id-token: write

# JOBS: Independent units of work
jobs:

  # ── JOB 1: Backend (Go) ───────────────────────────────────────────────────
  backend:
    if: github.event.inputs.deploy_environment != 'rollback'
    runs-on: ubuntu-latest
    name: Backend Tests & Build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        working-directory: ./backend
        run: go mod download

      - name: Verify dependencies
        working-directory: ./backend
        run: go mod verify

      - name: Run tests
        working-directory: ./backend
        run: |
          # Exclude scripts folder which has multiple main functions
          TEST_PKGS=$(go list ./... | grep -v /scripts)
          if [ -z "$TEST_PKGS" ]; then
            echo "No test files found, skipping tests"
            exit 0
          fi
          go test -v $TEST_PKGS

      - name: Run linter
        working-directory: ./backend
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          # Lint only specific directories, excluding scripts and seeds
          golangci-lint run ./config/... ./core/... ./internal/... ./services/...
        continue-on-error: true

      - name: Build backend
        working-directory: ./backend
        run: go build -v -o bin/server main.go

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-binary
          path: backend/bin/server
          retention-days: 7

  # ── JOB 2: Frontend Admin ─────────────────────────────────────────────────
  frontend-admin:
    if: github.event.inputs.deploy_environment != 'rollback'
    runs-on: ubuntu-latest
    name: Frontend Admin Build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/admin/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend/admin
        run: npm ci

      - name: Build CSS
        working-directory: ./frontend/admin
        run: npm run build:css

      - name: Upload admin build
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: frontend/admin/dist/
          retention-days: 7

  # ── JOB 3: Frontend Superadmin ────────────────────────────────────────────
  frontend-superadmin:
    if: github.event.inputs.deploy_environment != 'rollback'
    runs-on: ubuntu-latest
    name: Frontend Superadmin Build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check structure
        working-directory: ./frontend/superadmin
        run: |
          echo "Superadmin structure validated"
          ls -la

  # ── JOB 4: Security Scan ──────────────────────────────────────────────────
  security-scan:
    if: github.event.inputs.deploy_environment != 'rollback'
    runs-on: ubuntu-latest
    name: Security & Vulnerability Scan
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Go vulnerability check
        working-directory: ./backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          VULN_PKGS=$(go list ./... | grep -v /scripts)
          govulncheck $VULN_PKGS || true

  # ── JOB 5: Deployment ─────────────────────────────────────────────────────
  deployment:
    if: github.ref == 'refs/heads/staging'
    needs: [backend, frontend-admin, frontend-superadmin]
    runs-on: ubuntu-latest
    name: Deployment

    environment:
      name: production
      url: http://104.248.138.150:8080

    env:
      DEPLOY_BRANCH: staging

    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-binary
          path: ./artifacts/backend

      - name: Download admin artifact
        uses: actions/download-artifact@v4
        with:
          name: admin-dist
          path: ./artifacts/admin

      - name: Create deployment backup
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: 22
          script: |
            echo "💾 Creating backup..."
            mkdir -p ~/backups ~/anytime-trip
            cd ~/anytime-trip
            tar -czf ~/backups/anytime-trip-$(date +%Y%m%d-%H%M%S).tar.gz . || true

            # Keep only last 5 backups
            cd ~/backups
            ls -t anytime-trip-*.tar.gz 2>/dev/null | tail -n +6 | xargs -r rm

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: 22
          script: |
            export PATH=$PATH:/usr/local/go/bin
            echo "🚀 Starting deployment..."
            mkdir -p ~/anytime-trip
            cd ~/anytime-trip

            # Pull latest code (or clone if first time)
            if [ -d ".git" ]; then
              git fetch --all --prune
              git checkout ${{ env.DEPLOY_BRANCH }}
              git pull origin ${{ env.DEPLOY_BRANCH }}
            else
              git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} .
              git checkout ${{ env.DEPLOY_BRANCH }}
            fi

            # Write .env file
            echo "🔑 Writing .env file..."
            cat > backend/.env << 'ENVEOF'
            PORT=${{ secrets.APP_PORT }}
            MONGO_URI=${{ secrets.MONGO_URI }}
            MONGO_DB_NAME=${{ secrets.MONGO_DB_NAME }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            ENVIRONMENT=staging
            SMTP_HOST=${{ secrets.SMTP_HOST }}
            SMTP_PORT=${{ secrets.SMTP_PORT }}
            SMTP_USERNAME=${{ secrets.SMTP_USERNAME }}
            SENDER_EMAIL=${{ secrets.SENDER_EMAIL }}
            SENDER_PASSWORD=${{ secrets.SENDER_PASSWORD }}
            ENVEOF

            # Setup Nginx reverse proxy (only once, idempotent)
            echo "🔧 Setting up Nginx reverse proxy..."
            cd backend/scripts
            chmod +x setup_nginx.sh
            sudo ./setup_nginx.sh anytimetrip.online ${{ secrets.APP_PORT }} || echo "Nginx already configured"
            
            # Setup SSL/HTTPS with Let's Encrypt
            echo "🔒 Setting up SSL/HTTPS..."
            chmod +x setup_ssl.sh
            sudo ./setup_ssl.sh anytimetrip.online ${{ secrets.ADMIN_EMAIL }} || echo "SSL already configured"
            cd ../..

            # Backend deployment
            echo "📦 Deploying backend..."
            cd backend
            go build -o bin/server main.go
            sudo systemctl restart anytime-backend-staging

            # Frontend deployment
            echo "🎨 Deploying frontend..."
            cd ../frontend/admin
            npm install
            npm run build:css

            # Verify services
            echo "✅ Verifying services..."
            sudo systemctl status anytime-backend-staging --no-pager
            sudo systemctl status nginx --no-pager

            # Log deployment
            echo "$(date): Deployed commit ${{ github.sha }}" >> ~/deployment.log

            echo "✨ Deployment complete!"

  # ── JOB 6: Rollback Production (Manual) ───────────────────────────────────
  rollback-production:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_environment == 'rollback'
    runs-on: ubuntu-latest
    name: Rollback Production

    environment:
      name: production

    steps:
      - name: Rollback Production
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: 22
          script: |
            echo "⏮️  Starting rollback..."
            cd ~/anytime-trip

            # Restore from latest backup
            LATEST_BACKUP=$(ls -t ~/backups/anytime-trip-*.tar.gz 2>/dev/null | head -1)
            if [ -z "$LATEST_BACKUP" ]; then
              echo "❌ No backup found!"
              exit 1
            fi

            echo "Restoring from: $LATEST_BACKUP"
            tar -xzf "$LATEST_BACKUP" -C ~/anytime-trip

            # Restart services
            sudo systemctl restart anytime-backend

            echo "✅ Rollback complete!"
