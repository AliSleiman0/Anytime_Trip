<div style="position:relative; min-height:100vh; display:flex; align-items:center; justify-content:center;">
  <!-- blurred background layer -->
  <div style="position:absolute; inset:0; background-image:url('/static/admin/images/login-background.png'); background-size:cover; background-position:center; filter:blur(8px); -webkit-filter:blur(8px);"></div>

  <!-- content above the blurred background -->
  <div style="position:relative; z-index:1;" class="flex justify-center items-center">
    <div class="bg-white rounded-2xl shadow-2xl overflow-hidden flex max-w-4xl w-full">
      <!-- Left side: City Image -->
      <div class="w-2/5">
        <img src="/static/admin/images/city-image.png" alt="City View" class="h-full w-full object-cover" />
      </div>
      
      <!-- Right side: Verification Form -->
      <div class="w-3/5 p-12 flex flex-col justify-center">
        <div class="max-w-md mx-auto w-full">
          <!-- Logo -->
          <h1 class="text-4xl font-bold text-center text-[#336891] mb-6 tracking-tight">Travel</h1>
          
          <!-- Heading -->
          <h2 class="text-3xl font-semibold text-center text-gray-800 mb-8">Forgot Password</h2>
          
          <!-- Verification Form -->
          <form action="/admin/verify-code" method="POST" class="space-y-5">
            <!-- Email Field with Resend Code Button -->
            <div>
              <label for="email" class="block text-sm text-gray-600 mb-2">Your email</label>
              <div class="flex gap-2">
                <input 
                  type="email" 
                  id="email" 
                  name="email" 
                  class="flex-1 px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-opacity-50 focus:border-transparent" 
                  style="--tw-ring-color: #336891;"
                  placeholder=""
                  readonly
                />
                <button 
                  type="button" 
                  class="px-4 py-3 font-medium text-white rounded-lg transition duration-200 whitespace-nowrap text-sm"
                  style="background-color: #336891;"
                  onmouseover="this.style.backgroundColor='#264d6e';"
                  onmouseout="this.style.backgroundColor='#336891';"
                  onclick="resendCode(this)"
                >
                  Resend Code
                </button>
              </div>
            </div>
            
            <!-- Verification Code Input -->
            <div>
              <label class="block text-sm text-gray-600 mb-3">Verification code</label>
              <div class="flex gap-2 justify-between">
                <input 
                  type="text" 
                  maxlength="1" 
                  class="w-12 h-12 text-center text-2xl border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:border-transparent font-semibold"
                  style="--tw-ring-color: #336891;"
                  placeholder=""
                  onkeyup="moveToNext(this)"
                />
                <input 
                  type="text" 
                  maxlength="1" 
                  class="w-12 h-12 text-center text-2xl border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:border-transparent font-semibold"
                  style="--tw-ring-color: #336891;"
                  placeholder=""
                  onkeyup="moveToNext(this)"
                />
                <input 
                  type="text" 
                  maxlength="1" 
                  class="w-12 h-12 text-center text-2xl border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:border-transparent font-semibold"
                  style="--tw-ring-color: #336891;"
                  placeholder=""
                  onkeyup="moveToNext(this)"
                />
                <input 
                  type="text" 
                  maxlength="1" 
                  class="w-12 h-12 text-center text-2xl border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:border-transparent font-semibold"
                  style="--tw-ring-color: #336891;"
                  placeholder=""
                  onkeyup="moveToNext(this)"
                />
                <input 
                  type="text" 
                  maxlength="1" 
                  class="w-12 h-12 text-center text-2xl border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:border-transparent font-semibold"
                  style="--tw-ring-color: #336891;"
                  placeholder=""
                  onkeyup="moveToNext(this)"
                />
                <input 
                  type="text" 
                  maxlength="1" 
                  class="w-12 h-12 text-center text-2xl border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:border-transparent font-semibold"
                  style="--tw-ring-color: #336891;"
                  placeholder=""
                  onkeyup="moveToNext(this)"
                />
              </div>
              <!-- Hidden input to store full verification code -->
              <input type="hidden" id="verification-code" name="code" />
            </div>
            
            <!-- Next Button -->
            <button 
              type="submit" 
              class="w-full text-white font-medium py-3 rounded-lg transition duration-200"
              style="background-color: #336891;"
              onmouseover="this.style.backgroundColor='#264d6e';"
              onmouseout="this.style.backgroundColor='#336891';"
            >
              Next
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
  
  <script>
    function moveToNext(field) {
      const inputs = document.querySelectorAll('input[type="text"][maxlength="1"]');
      const codeInput = document.getElementById('verification-code');
      
      // Update hidden input with combined code
      let code = '';
      inputs.forEach(input => {
        code += input.value;
      });
      codeInput.value = code;
      
      // Move to next input if current is filled
      if (field.value.length === 1) {
        const index = Array.from(inputs).indexOf(field);
        if (index < inputs.length - 1) {
          inputs[index + 1].focus();
        }
      }
      
      // Handle backspace
      if (field.value.length === 0) {
        const index = Array.from(inputs).indexOf(field);
        if (index > 0) {
          inputs[index - 1].focus();
        }
      }
    }
    
    function resendCode(button) {
      const originalText = button.textContent;
      button.textContent = 'Code Sent';
      button.disabled = true;
      
      setTimeout(() => {
        button.textContent = originalText;
        button.disabled = false;
      }, 3000);
    }
  </script>
</div>
