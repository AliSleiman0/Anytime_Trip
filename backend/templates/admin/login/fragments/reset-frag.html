<div style="position:relative; min-height:100vh; display:flex; align-items:center; justify-content:center;">
  <!-- blurred background layer -->
  <div style="position:absolute; inset:0; background-image:url('/static/admin/images/login-background.png'); background-size:cover; background-position:center; filter:blur(8px); -webkit-filter:blur(8px);"></div>

  <!-- content above the blurred background -->
  <div style="position:relative; z-index:1;" class="flex justify-center items-center">
    <div class="bg-white rounded-2xl shadow-2xl overflow-hidden flex max-w-4xl w-full">
      <!-- Left side: City Image -->
      <div class="w-2/5">
        <img src="/static/admin/images/city-image.png" alt="City View" class="h-full w-full object-cover" />
      </div>
      
      <!-- Right side: Reset Password Form -->
      <div class="w-3/5 p-12 flex flex-col justify-center">
        <div class="max-w-md mx-auto w-full">
          <!-- Logo -->
          <img src="/static/admin/images/logo2.png" alt="Anytime Logo" class="w-28 h-28 mx-auto mb-6" />
          
          <!-- Heading -->
          <h2 class="text-3xl font-semibold text-center text-gray-800 mb-2">Create new password</h2>
          <p class="text-center text-gray-500 mb-6">Enter your new password below</p>
          
          <!-- Error Message -->
          <div id="errorMessage" class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg mb-5 hidden"></div>
          
          <!-- Success Message -->
          <div id="successMessage" class="bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-lg mb-5 hidden"></div>
          
          <!-- Reset Password Form -->
          <form id="resetForm" class="space-y-5">
            <!-- New Password Field -->
            <div>
              <label for="new-password" class="block text-sm text-gray-600 mb-2">New Password</label>
              <div class="relative">
                <input 
                  type="password" 
                  id="new-password" 
                  name="password" 
                  class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-opacity-50 focus:border-transparent pr-12" 
                  style="--tw-ring-color: #336891;"
                  placeholder=""
                  required
                />
                <button 
                  type="button" 
                  class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600"
                  aria-label="Toggle password visibility"
                  onclick="togglePasswordVisibility('new-password')"
                >
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                  </svg>
                </button>
              </div>
            </div>
            
            <!-- Confirm Password Field -->
            <div>
              <label for="confirm-password" class="block text-sm text-gray-600 mb-2">Confirm Password</label>
              <div class="relative">
                <input 
                  type="password" 
                  id="confirm-password" 
                  name="confirm_password" 
                  class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-opacity-50 focus:border-transparent pr-12" 
                  style="--tw-ring-color: #336891;"
                  placeholder=""
                  required
                />
                <button 
                  type="button" 
                  class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600"
                  aria-label="Toggle password visibility"
                  onclick="togglePasswordVisibility('confirm-password')"
                >
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                  </svg>
                </button>
              </div>
            </div>
            
            <!-- Finish Button -->
            <button 
              type="submit" 
              class="w-full text-white font-medium py-3 rounded-lg transition duration-200"
              style="background-color: #336891;"
              onmouseover="this.style.backgroundColor='#264d6e';"
              onmouseout="this.style.backgroundColor='#336891';"
            >
              Finish
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
  
  <script>
    function togglePasswordVisibility(fieldId) {
      const field = document.getElementById(fieldId);
      const type = field.getAttribute('type') === 'password' ? 'text' : 'password';
      field.setAttribute('type', type);
    }
    
    // Form submission handler
    const form = document.getElementById('resetForm');
    const errorDiv = document.getElementById('errorMessage');
    const successDiv = document.getElementById('successMessage');
    
    // Get token from URL
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    
    if (!token) {
      errorDiv.textContent = 'Invalid or missing reset token. Please request a new password reset.';
      errorDiv.classList.remove('hidden');
      form.style.display = 'none';
    }
    
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      // Clear messages
      errorDiv.classList.add('hidden');
      successDiv.classList.add('hidden');
      
      const password = document.getElementById('new-password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      
      // Client-side validation
      if (!password || !confirmPassword) {
        errorDiv.textContent = 'All fields are required';
        errorDiv.classList.remove('hidden');
        return;
      }
      
      if (password.length < 8) {
        errorDiv.textContent = 'Password must be at least 8 characters';
        errorDiv.classList.remove('hidden');
        return;
      }
      
      if (password !== confirmPassword) {
        errorDiv.textContent = 'Passwords do not match';
        errorDiv.classList.remove('hidden');
        return;
      }
      
      // Submit form
      const formData = new FormData();
      formData.append('token', token);
      formData.append('password', password);
      formData.append('confirm_password', confirmPassword);
      
      try {
        const response = await fetch('/admin/reset-password', {
          method: 'POST',
          body: formData
        });
        
        const data = await response.json();
        
        if (!response.ok) {
          errorDiv.textContent = data.error || 'Failed to reset password';
          errorDiv.classList.remove('hidden');
          return;
        }
        
        successDiv.textContent = data.message || 'Password reset successfully!';
        successDiv.classList.remove('hidden');
        form.reset();
        
        // Redirect to login after 2 seconds
        setTimeout(() => {
          window.location.href = data.redirect || '/admin/login';
        }, 2000);
      } catch (error) {
        console.error('Error:', error);
        errorDiv.textContent = 'An error occurred. Please try again.';
        errorDiv.classList.remove('hidden');
      }
    });
  </script>
</div>
