<div style="position:relative; min-height:100vh; display:flex; align-items:center; justify-content:center;">
  <!-- blurred background layer -->
  <div style="position:absolute; inset:0; background-image:url('/static/admin/images/login-background.png'); background-size:cover; background-position:center; filter:blur(8px); -webkit-filter:blur(8px);"></div>

  <!-- content above the blurred background -->
  <div style="position:relative; z-index:1;" class="flex justify-center items-center">
    <div class="bg-white rounded-2xl shadow-2xl overflow-hidden flex max-w-4xl w-full">
      <!-- Left side: City Image -->
      <div class="w-2/5">
        <img src="/static/admin/images/city-image.png" alt="City View" class="h-full w-full object-cover" />
      </div>
      
      <!-- Right side: Login Form -->
      <div class="w-3/5 p-12 flex flex-col justify-center">
        <div class="max-w-md mx-auto w-full">
          <!-- Logo -->
          <h1 class="text-4xl font-bold text-center text-[#336891] mb-6 tracking-tight">Travel</h1>
          
          <!-- Heading -->
          <h2 class="text-3xl font-semibold text-center text-gray-800 mb-8">Log in</h2>
          
          <!-- Login Form -->
          <form action="/admin/login" method="POST" class="space-y-5" onsubmit="handleLogin(event)">
            <!-- Email Field -->
            <div>
              <label for="email" class="block text-sm text-gray-600 mb-2">Your email</label>
              <input 
                type="email" 
                id="email" 
                name="email" 
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" 
                placeholder=""
              />
            </div>
            
            <!-- Password Field -->
            <div>
              <label for="password" class="block text-sm text-gray-600 mb-2">Your password</label>
              <div class="relative">
                <input 
                  type="password" 
                  id="password" 
                  name="password" 
                  class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent pr-12" 
                  placeholder=""
                />
                <button 
                  type="button" 
                  onclick="togglePassword()" 
                  class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600"
                  aria-label="Toggle password visibility"
                >
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                  </svg>
                </button>
              </div>
            </div>
            
            <!-- Forgot Password Link -->
            <div class="text-right">
              <a href="/admin/forget" class="text-sm text-gray-700 hover:text-gray-900 underline">Forgot your password</a>
            </div>
            
            <!-- Error Message -->
            <p id="error-message" class="text-red-600 text-sm text-center hidden"></p>
            
            <!-- Login Button -->
            <button 
              id="login-button"
              type="submit" 
              class="w-full text-white font-medium py-3 rounded-lg transition duration-200"
              style="background-color: #336891;"
              onmouseover="this.style.backgroundColor='#264d6e';"
              onmouseout="this.style.backgroundColor='#336891';"
            >
              Login
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
  
  <script>
    function togglePassword() {
      const passwordInput = document.getElementById('password');
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
    }

    function showError(message) {
      const errorElement = document.getElementById('error-message');
      errorElement.textContent = message;
      errorElement.classList.remove('hidden');
    }

    function hideError() {
      const errorElement = document.getElementById('error-message');
      errorElement.classList.add('hidden');
    }

    async function handleLogin(event) {
      event.preventDefault();
      hideError();

      const form = event.target;
      const formData = new FormData(form);
      const loginButton = document.getElementById('login-button');
      const originalText = loginButton ? loginButton.textContent : null;

      let redirected = false;

      if (loginButton) {
        loginButton.disabled = true;
        loginButton.style.opacity = '0.7';
        loginButton.textContent = 'Loading...';
      }

      try {
        const response = await fetch(form.action, {
          method: 'POST',
          body: formData
        });

        if (response.redirected) {
          redirected = true;
          window.location.href = response.url;
        } else if (!response.ok) {
          const text = await response.text();
          showError(text || 'Invalid email or password');
        } else {
          redirected = true;
          window.location.href = '/admin/dashboard';
        }
      } catch (error) {
        showError('Network error. Please try again.');
      } finally {
        if (!redirected && loginButton) {
          loginButton.disabled = false;
          loginButton.style.opacity = '';
          if (originalText !== null) loginButton.textContent = originalText;
        }
      }
    }
  </script>
</div>
