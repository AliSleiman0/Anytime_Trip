<div class="fixed top-0 left-64 right-0 h-screen overflow-auto">
  <main class="">
    <div hx-get="/admin/header?title=Error&subtitle=Something went wrong" hx-trigger="load" hx-swap="innerHTML"></div>

    <!-- Error Content -->
    <div class="p-8">
      <div class="bg-white rounded-xl shadow-[0_4px_4px_0_#0000001A] p-8">
        <div class="text-center">
          <div class="mb-6">
            <svg class="w-16 h-16 text-red-500 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z"></path>
            </svg>
          </div>
          <h1 class="text-2xl font-bold text-gray-900 mb-4">Oops! Something went wrong</h1>
          <p class="text-gray-600 mb-6">{{.ErrorMessage}}</p>
          <div class="space-x-4">
            <button
              onclick="window.history.back()"
              class="bg-[#336891] text-white px-6 py-2 rounded-lg hover:bg-[#285a7c] transition-colors"
            >
              Go Back
            </button>
            <a
              href="/admin/dashboard"
              class="bg-gray-500 text-white px-6 py-2 rounded-lg hover:bg-gray-600 transition-colors"
            >
              Go to Dashboard
            </a>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
