<div class="fixed top-0 left-0 md:left-64 right-0 h-screen overflow-auto">
  <main>
    <div
      hx-get="/admin/header?title=Homepage Management&subtitle=Manage homepage content"
      hx-trigger="load"
      hx-swap="innerHTML"
    ></div>

    <div class="px-4 pt-2 pb-6 bg-[#E6F0F9] min-h-screen">
        <div class="flex flex-col md:flex-row md:justify-between gap-4 mb-6">
          <div class="flex gap-4 md:gap-8 text-sm font-semibold text-[#336891] overflow-x-auto pb-2">
          <a href="/admin/cms/homepage/travel" class="pb-2 hover:text-[#1f3242] whitespace-nowrap flex-shrink-0"
            >Travel Experience Section</a
          >
          <a href="/admin/cms/homepage/banner" class="pb-2 hover:text-[#1f3242] whitespace-nowrap flex-shrink-0"
            >Banner</a
          >
          <a href="/admin/cms/homepage/popular" class="relative pb-2 whitespace-nowrap flex-shrink-0"
            >Popular Locations
            <span
              class="absolute left-0 right-0 -bottom-0.5 h-0.5 bg-[#336891]"
            ></span>
          </a>
        </div>
        
        <div class="flex flex-col sm:flex-row gap-2">
          <button
            id="save-popular-btn"
            hx-post="/admin/cms/homepage/popular/save"
            hx-trigger="click"
            hx-encoding="multipart/form-data"
            hx-include="#popular-sections"
            hx-swap="none"
            hx-on="htmx:afterRequest: if (event.detail.xhr && event.detail.xhr.status === 200) { if (typeof Swal !== 'undefined') { Swal.fire({icon: 'success', title: 'Saved & Published', timer: 1500, showConfirmButton: false}); setTimeout(function() { window.location.reload(); }, 1500); } else { window.location.reload(); } } else { if (typeof Swal !== 'undefined') { Swal.fire({icon: 'error', title: 'Save failed'}); } else { alert('Save failed'); } }"
            class="bg-[#336891] w-full sm:w-64 h-12 text-white text-lg rounded-xl flex justify-center items-center p-2"
          >
            Save & Publish
          </button>
          <button
            id="add-popular-section-btn"
            type="button"
            class="bg-[#336891] w-full sm:w-64 h-12 text-white text-lg rounded-xl flex justify-center items-center p-2"
          >
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M18 12.998H13V17.998C13 18.2633 12.8946 18.5176 12.7071 18.7052C12.5196 18.8927 12.2652 18.998 12 18.998C11.7348 18.998 11.4804 18.8927 11.2929 18.7052C11.1054 18.5176 11 18.2633 11 17.998V12.998H6C5.73478 12.998 5.48043 12.8927 5.29289 12.7052C5.10536 12.5176 5 12.2633 5 11.998C5 11.7328 5.10536 11.4785 5.29289 11.2909C5.48043 11.1034 5.73478 10.998 6 10.998H11V5.99805C11 5.73283 11.1054 5.47848 11.2929 5.29094C11.4804 5.1034 11.7348 4.99805 12 4.99805C12.2652 4.99805 12.5196 5.1034 12.7071 5.29094C12.8946 5.47848 13 5.73283 13 5.99805V10.998H18C18.2652 10.998 18.5196 11.1034 18.7071 11.2909C18.8946 11.4785 19 11.7328 19 11.998C19 12.2633 18.8946 12.5176 18.7071 12.7052C18.5196 12.8927 18.2652 12.998 18 12.998Z"
                fill="white"
              />
            </svg>
            Add Popular Location Section
          </button>
        </div>
      </div>

      <div class="p-6">
        <div id="popular-sections" data-next-index="{{.NextIndex}}">
          {{range .Sections}}
          <div class="popular-section" data-index="{{.Index}}">
            <div class="flex gap-6">
              <div class="w-1/2">
                <h3 class="font-semibold mb-2 text-xl">Image Title</h3>
                <input
                  type="text"
                  name="popular_title_{{.Index}}"
                  value="{{.Item.Title}}"
                  class="w-full h-11 bg-[#E6F0F9] border-[#336891] rounded-lg border bg-none px-3 text-sm text-[#1f3242] placeholder:text-[#8AA6BD] focus:outline-none focus:ring-2 focus:ring-[#336891]"
                  placeholder="Enter image title"
                />
              </div>
              <div class="w-1/2">
                <h3 class="font-semibold mb-2 text-xl">Location</h3>
                <input
                  type="text"
                  name="popular_location_{{.Index}}"
                  value="{{.Item.Location}}"
                  class="w-full h-11 bg-[#E6F0F9] border-[#336891] rounded-lg border bg-none px-3 text-sm text-[#1f3242] placeholder:text-[#8AA6BD] focus:outline-none focus:ring-2 focus:ring-[#336891]"
                  placeholder="Enter location"
                />
              </div>
            </div>

            <div class="flex items-center my-4 text-sm font-semibold text-[#1f3242]">
              <span class="text-xl font-semibold mr-5">Image {{.Index}}</span>
              <button type="button" class="ml-auto text-red-600 remove-popular-btn">Remove</button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div>
                <p class="text-xs font-semibold text-[#1f3242] mb-2">Upload Image</p>
                <label
                  class="flex flex-col items-center justify-center gap-2 rounded-xl border border-dashed border-[#8DB2D9] bg-[#F5FAFF] text-[#5A7A96] h-48 cursor-pointer transition hover:border-[#336891]"
                >
                  <span class="text-sm font-semibold">Drag &amp; Drop</span>
                  <span class="text-xs">Or</span>
                  <span class="px-4 py-1.5 bg-[#336891] text-white text-xs rounded-full">Upload</span>
                  <input
                    type="file"
                    name="popular_image_{{.Index}}"
                    accept="image/*"
                    class="hidden popular-file-input"
                    hx-post="/admin/cms/homepage/popular/upload"
                    hx-encoding="multipart/form-data"
                    hx-vals='{"popular-slot":"{{.Index}}"}'
                    hx-target="#current-popular-{{.Index}}"
                    hx-swap="outerHTML"
                  />
                </label>
              </div>

              <div>
                <p class="text-xs font-semibold text-[#1f3242] mb-2">Current Image</p>
                <div id="current-popular-{{.Index}}" class="w-full h-48 rounded-xl overflow-hidden border border-[#CAD9EA] bg-[#e7eef6] relative" style="background-image:url('{{if .Item.ImagePath}}{{.Item.ImagePath}}{{else}}/static/admin/images/paris.webp{{end}}'); background-size:cover; background-position:center;">
                  {{if .Item.ImagePath}}
                    <div class="absolute top-2 right-2 bg-green-500 rounded-full p-1.5"><svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg></div>
                    <input type="hidden" name="popular_image_path_{{.Index}}" value="{{.Item.ImagePath}}" />
                  {{else}}
                    <input type="hidden" name="popular_image_path_{{.Index}}" value="" />
                  {{end}}
                </div>
              </div>
            </div>
          </div>
          {{end}}
        </div>

        <template id="popular-section-template">
          <div class="popular-section" data-index="%%INDEX%%">
            <div class="flex gap-6">
              <div class="w-1/2">
                <h3 class="font-semibold mb-2 text-xl">Image Title</h3>
                <input type="text" name="popular_title_%%INDEX%%" class="w-full h-11 bg-[#E6F0F9] border-[#336891] rounded-lg border bg-none px-3 text-sm text-[#1f3242]" placeholder="Enter image title" />
              </div>
              <div class="w-1/2">
                <h3 class="font-semibold mb-2 text-xl">Location</h3>
                <input type="text" name="popular_location_%%INDEX%%" class="w-full h-11 bg-[#E6F0F9] border-[#336891] rounded-lg border bg-none px-3 text-sm text-[#1f3242]" placeholder="Enter location" />
              </div>
            </div>
            <div class="flex items-center my-4 text-sm font-semibold text-[#1f3242]"><span class="text-xl font-semibold mr-5">Image %%INDEX%%</span><button type="button" class="ml-auto text-red-600 remove-popular-btn">Remove</button></div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div>
                <p class="text-xs font-semibold text-[#1f3242] mb-2">Upload Image</p>
                <label class="flex flex-col items-center justify-center gap-2 rounded-xl border border-dashed border-[#8DB2D9] bg-[#F5FAFF] text-[#5A7A96] h-48 cursor-pointer transition hover:border-[#336891]">
                  <span class="text-sm font-semibold">Drag &amp; Drop</span>
                  <span class="text-xs">Or</span>
                  <span class="px-4 py-1.5 bg-[#336891] text-white text-xs rounded-full">Upload</span>
                  <input type="file" name="popular_image_%%INDEX%%" accept="image/*" class="hidden popular-file-input" hx-post="/admin/cms/homepage/popular/upload" hx-encoding="multipart/form-data" hx-vals='{"popular-slot":"%%INDEX%%"}' hx-target="#current-popular-%%INDEX%%" hx-swap="outerHTML" />
                </label>
              </div>
              <div>
                <p class="text-xs font-semibold text-[#1f3242] mb-2">Current Image</p>
                <div id="current-popular-%%INDEX%%" class="w-full h-48 rounded-xl overflow-hidden border border-[#CAD9EA] bg-[#e7eef6] relative" style="background-image:url('/static/admin/images/paris.webp'); background-size:cover; background-position:center;">
                  <input type="hidden" name="popular_image_path_%%INDEX%%" value="" />
                </div>
              </div>
            </div>
          </div>
        </template>

        <script>
          (function(){
            const container = document.getElementById('popular-sections');
            const tpl = document.getElementById('popular-section-template').innerHTML;
            // read initial next index from DOM data attribute to avoid raw template tokens inside JS
            let nextIndex = parseInt(container.getAttribute('data-next-index')) || 2;

            const addBtn = document.getElementById('add-popular-section-btn');
            if (addBtn) {
              addBtn.addEventListener('click', function(){
                const html = tpl.replace(/%%INDEX%%/g, nextIndex);
                const tmp = document.createElement('div'); tmp.innerHTML = html;
                container.appendChild(tmp.firstElementChild);
                nextIndex++;
              });
            }

            document.addEventListener('click', function(e){
              if(e.target && e.target.classList.contains('remove-popular-btn')){
                const sec = e.target.closest('.popular-section');
                if(!sec) return;
                const idx = sec.getAttribute('data-index');
                const del = document.createElement('input'); del.type='hidden'; del.name = 'popular_image_delete_'+idx; del.value='on';
                sec.appendChild(del);
                sec.remove();
              }
            });
          })();
        </script>
      </div>
    </div>
  </main>
</div>
