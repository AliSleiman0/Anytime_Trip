<div class="fixed top-0 left-0 md:left-64 right-0 h-screen overflow-auto">
  <main>
    <div
      hx-get="/admin/header?title=Homepage Management&subtitle=Manage homepage content"
      hx-trigger="load"
      hx-swap="innerHTML"
    ></div>

    <div class="px-4 pt-2 pb-6 bg-[#E6F0F9] min-h-screen">
      <!-- CMS Homepage Banner Fragment -->
      <!-- Server-rendered template: iterates saved banners and supports HTMX uploads/saves -->
      <div class="fixed top-0 left-0 md:left-64 right-0 h-screen overflow-auto">
        <main>
          <div
            hx-get="/admin/header?title=Homepage Management&subtitle=Manage homepage content"
            hx-trigger="load"
            hx-swap="innerHTML"
          ></div>

          <div class="px-4 pt-2 pb-6 bg-[#E6F0F9] min-h-screen">
            <form id="banner-form">
            <div class="flex flex-col md:flex-row md:justify-between gap-4 mb-6">
              <div class="flex gap-4 md:gap-8 text-sm font-semibold text-[#336891] overflow-x-auto pb-2">
                <a href="/admin/cms/homepage/travel" class="pb-2 hover:text-[#1f3242] whitespace-nowrap flex-shrink-0">Travel Experience Section</a>
                <a href="/admin/cms/homepage/banner" class="relative pb-2 whitespace-nowrap flex-shrink-0">Banner
                  <span class="absolute left-0 right-0 -bottom-0.5 h-0.5 bg-[#336891]"></span>
                </a>
                <a href="/admin/cms/homepage/popular" class="pb-2 hover:text-[#1f3242] whitespace-nowrap flex-shrink-0">Popular Locations</a>
              </div>

              <div class="flex gap-2">
                <button
                  class="bg-[#336891] w-full md:w-64 h-12 text-white text-lg rounded-xl flex justify-center items-center p-2"
                  hx-post="/admin/cms/homepage/banner/save"
                  hx-encoding="multipart/form-data"
                  hx-include="#banner-form"
                  hx-swap="none"
                  hx-on="htmx:afterRequest: if (event.detail.xhr && event.detail.xhr.status === 200) { Swal.fire({icon: 'success', title: 'Saved & Published', timer: 1500, showConfirmButton: false}); setTimeout(function() { window.location.reload(); }, 1500); } else { Swal.fire({icon: 'error', title: 'Save failed'}) }"
                >
                  Save & Publish
                </button>
              </div>
            </div>

            <div id="banner-sections">
              <!-- Banner Section 1 -->
              <div class="p-6 relative" data-banner-index="1">
                <div class="flex items-center mb-4 text-sm font-semibold text-[#1f3242]"><span class="text-xl font-semibold mr-5">Home Page Banner</span>
                  <svg width="21" height="15" viewBox="0 0 21 15" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" d="M4.8241 10.8535C3.39615 9.62663 2.37622 8.22431 1.89774 7.5C2.37622 6.77569 3.39615 5.37336 4.8241 4.14651C6.29837 2.87986 8.11873 1.875 10.1665 1.875C12.2143 1.875 14.0347 2.87986 15.5089 4.14651C16.9369 5.37336 17.9568 6.77569 18.4353 7.5C17.9568 8.22431 16.9369 9.62663 15.5089 10.8535C14.0347 12.1202 12.2143 13.125 10.1665 13.125C8.11873 13.125 6.29837 12.1202 4.8241 10.8535ZM10.1665 0C7.49229 0 5.25132 1.30746 3.60221 2.72433C1.94711 4.14634 0.79857 5.754 0.288851 6.53419C-0.0962836 7.12359 -0.0962836 7.87641 0.288851 8.46581C0.79857 9.246 1.94711 10.8536 3.60221 12.2757C5.25132 13.6926 7.49229 15 10.1665 15C12.8407 15 15.0817 13.6926 16.7308 12.2757C18.3859 10.8536 19.5344 9.246 20.0442 8.46581C20.4293 7.87641 20.4293 7.12359 20.0442 6.53419C19.5344 5.754 18.3859 4.14634 16.7308 2.72433C15.0817 1.30746 12.8407 0 10.1665 0ZM8.29147 7.5C8.29147 6.46444 9.131 5.625 10.1665 5.625C11.202 5.625 12.0415 6.46444 12.0415 7.5C12.0415 8.53556 11.202 9.375 10.1665 9.375C9.131 9.375 8.29147 8.53556 8.29147 7.5ZM10.1665 3.75C8.09544 3.75 6.41651 5.42893 6.41651 7.5C6.41651 9.57103 8.09544 11.25 10.1665 11.25C12.2376 11.25 13.9165 9.57103 13.9165 7.5C13.9165 5.42893 12.2376 3.75 10.1665 3.75Z" fill="#336891"/></svg>
                </div>

                <div class="mb-4">
                  <label class="text-xs font-semibold text-[#1f3242]">Title</label>
                  <input type="text" name="banner_title_1" value="{{.Banner1.Title}}" class="w-full mt-2 p-2 rounded border" placeholder="Banner title" />
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                  <div>
                    <p class="text-xs font-semibold text-[#1f3242] mb-2">Upload Image</p>
                    <label class="flex flex-col items-center justify-center gap-2 rounded-xl border border-dashed border-[#8DB2D9] bg-[#F5FAFF] text-[#5A7A96] h-48 cursor-pointer transition hover:border-[#336891]">
                      <span class="text-sm font-semibold">Drag &amp; Drop</span>
                      <span class="text-xs">Or</span>
                      <span class="px-4 py-1.5 bg-[#336891] text-white text-xs rounded-full">Upload</span>
                      <input type="file" name="banner_image_1" accept="image/*" class="hidden" hx-post="/admin/cms/homepage/banner/upload" hx-encoding="multipart/form-data" hx-trigger="change" hx-target="#current-banner-1" hx-swap="outerHTML" hx-headers='{"X-Banner-Slot":"1"}' hx-on="htmx:afterSwap: Swal.fire({icon: 'success', title: 'Upload complete', timer: 1500, showConfirmButton: false})" />
                    </label>
                  </div>

                  <div>
                    <p class="text-xs font-semibold text-[#1f3242] mb-2">Current Image</p>
                    <div id="current-banner-1" class="w-full h-48 rounded-xl overflow-hidden border border-[#CAD9EA] bg-[#e7eef6] relative" style="background-image:url('{{if .Banner1.ImagePath}}{{.Banner1.ImagePath}}{{else}}/static/admin/images/paris.webp{{end}}'); background-size:cover; background-position:center;">
                      {{if .Banner1.ImagePath}}
                      <div class="absolute top-2 right-2 bg-green-500 rounded-full p-1.5"><svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg></div>
                      {{end}}
                    </div>
                  </div>
                </div>

                <input type="hidden" name="banner_image_path_1" value="{{.Banner1.ImagePath}}" />
              </div>

              <!-- Banner Section 2 -->
              <div class="p-6 relative" data-banner-index="2">
                <div class="flex items-center mb-4 text-sm font-semibold text-[#1f3242]"><span class="text-xl font-semibold mr-5">Search Banner</span>
                  <svg width="21" height="15" viewBox="0 0 21 15" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" d="M4.8241 10.8535C3.39615 9.62663 2.37622 8.22431 1.89774 7.5C2.37622 6.77569 3.39615 5.37336 4.8241 4.14651C6.29837 2.87986 8.11873 1.875 10.1665 1.875C12.2143 1.875 14.0347 2.87986 15.5089 4.14651C16.9369 5.37336 17.9568 6.77569 18.4353 7.5C17.9568 8.22431 16.9369 9.62663 15.5089 10.8535C14.0347 12.1202 12.2143 13.125 10.1665 13.125C8.11873 13.125 6.29837 12.1202 4.8241 10.8535ZM10.1665 0C7.49229 0 5.25132 1.30746 3.60221 2.72433C1.94711 4.14634 0.79857 5.754 0.288851 6.53419C-0.0962836 7.12359 -0.0962836 7.87641 0.288851 8.46581C0.79857 9.246 1.94711 10.8536 3.60221 12.2757C5.25132 13.6926 7.49229 15 10.1665 15C12.8407 15 15.0817 13.6926 16.7308 12.2757C18.3859 10.8536 19.5344 9.246 20.0442 8.46581C20.4293 7.87641 20.4293 7.12359 20.0442 6.53419C19.5344 5.754 18.3859 4.14634 16.7308 2.72433C15.0817 1.30746 12.8407 0 10.1665 0ZM8.29147 7.5C8.29147 6.46444 9.131 5.625 10.1665 5.625C11.202 5.625 12.0415 6.46444 12.0415 7.5C12.0415 8.53556 11.202 9.375 10.1665 9.375C9.131 9.375 8.29147 8.53556 8.29147 7.5ZM10.1665 3.75C8.09544 3.75 6.41651 5.42893 6.41651 7.5C6.41651 9.57103 8.09544 11.25 10.1665 11.25C12.2376 11.25 13.9165 9.57103 13.9165 7.5C13.9165 5.42893 12.2376 3.75 10.1665 3.75Z" fill="#336891"/></svg>
                </div>

                <div class="mb-4">
                  <label class="text-xs font-semibold text-[#1f3242]">Title</label>
                  <input type="text" name="banner_title_2" value="{{.Banner2.Title}}" class="w-full mt-2 p-2 rounded border" placeholder="Banner title" />
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                  <div>
                    <p class="text-xs font-semibold text-[#1f3242] mb-2">Upload Image</p>
                    <label class="flex flex-col items-center justify-center gap-2 rounded-xl border border-dashed border-[#8DB2D9] bg-[#F5FAFF] text-[#5A7A96] h-48 cursor-pointer transition hover:border-[#336891]">
                      <span class="text-sm font-semibold">Drag &amp; Drop</span>
                      <span class="text-xs">Or</span>
                      <span class="px-4 py-1.5 bg-[#336891] text-white text-xs rounded-full">Upload</span>
                      <input type="file" name="banner_image_2" accept="image/*" class="hidden" hx-post="/admin/cms/homepage/banner/upload" hx-encoding="multipart/form-data" hx-trigger="change" hx-target="#current-banner-2" hx-swap="outerHTML" hx-headers='{"X-Banner-Slot":"2"}' hx-on="htmx:afterSwap: Swal.fire({icon: 'success', title: 'Upload complete', timer: 1500, showConfirmButton: false})" />
                    </label>
                  </div>

                  <div>
                    <p class="text-xs font-semibold text-[#1f3242] mb-2">Current Image</p>
                    <div id="current-banner-2" class="w-full h-48 rounded-xl overflow-hidden border border-[#CAD9EA] bg-[#e7eef6] relative" style="background-image:url('{{if .Banner2.ImagePath}}{{.Banner2.ImagePath}}{{else}}/static/admin/images/paris.webp{{end}}'); background-size:cover; background-position:center;">
                      {{if .Banner2.ImagePath}}
                      <div class="absolute top-2 right-2 bg-green-500 rounded-full p-1.5"><svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg></div>
                      {{end}}
                    </div>
                  </div>
                </div>

                <input type="hidden" name="banner_image_path_2" value="{{.Banner2.ImagePath}}" />
              </div>
            </div>
            </form>

          </div>
        </main>
      </div>
              <p class="text-xs font-semibold text-[#1f3242] mb-2">Upload Image</p>
