<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} - Seven Hives Admin</title>
    <!-- Include HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <!-- Include Tailwind CSS or your CSS -->
    <link rel="stylesheet" href="/assets/css/main.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body class="bg-[#E6F0F9]">
    <!-- Sidebar Component -->
    <div hx-get="/admin/sidebar" hx-trigger="load" hx-swap="innerHTML"></div>
    
    <!-- Main Content Area - Admin Dashboard Fragment -->
    <div id="main-content" hx-get="/admin/dashboard-frag" hx-trigger="load" hx-swap="innerHTML"></div>
    
        <script>
            // Initialize the Active Booking chart when the fragment is swapped into the DOM
            function initActiveBookingChart() {
                const canvas = document.getElementById('activeBookingChart');
                if (!canvas || canvas.dataset.initialized === 'true' || typeof Chart === 'undefined') return;
                const ctx = canvas.getContext('2d');

                const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul'];
                const thisYear = [8000, 9500, 12000, 7000, 10500, 15000, 20000];
                const lastYear = [5000, 7000, 9000, 12000, 10000, 11000, 13000];

                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: months,
                        datasets: [
                            {
                                label: 'This year',
                                data: thisYear,
                                borderColor: '#336891',
                                backgroundColor: 'transparent',
                                borderWidth: 2,
                                tension: 0.4,
                                pointRadius: 0,
                                borderDash: [6, 4], // dotted style
                            },
                            {
                                label: 'Last year',
                                data: lastYear,
                                borderColor: '#000000',
                                backgroundColor: 'transparent',
                                borderWidth: 2,
                                tension: 0.4,
                                pointRadius: 0,
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false },
                            tooltip: { enabled: true }
                        },
                        scales: {
                            x: {
                                grid: { display: false }
                            },
                            y: {
                                min: 0,
                                max: 20000,
                                ticks: {
                                    stepSize: 10000,
                                    callback: function(value) {
                                        if (value === 0) return '0';
                                        return (value / 1000) + 'K';
                                    }
                                },
                                grid: {
                                    color: 'rgba(0,0,0,0.06)'
                                }
                            }
                        }
                    }
                });

                canvas.dataset.initialized = 'true';
            }

            function initFlightsChart() {
                const canvas = document.getElementById('flightsChart');
                if (!canvas || canvas.dataset.initialized === 'true' || typeof Chart === 'undefined') return;
                const ctx = canvas.getContext('2d');

                const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul'];
                const thisYear = [2000, 9000, 7000, 3000, 8000, 14000, 19000];
                const lastYear = [9000, 6000, 8000, 13000, 12000, 10000, 13000];

                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: months,
                        datasets: [
                            {
                                label: 'This year',
                                data: thisYear,
                                borderColor: '#336891',
                                backgroundColor: 'transparent',
                                borderWidth: 2,
                                tension: 0.4,
                                pointRadius: 0,
                                borderDash: [6, 4],
                            },
                            {
                                label: 'Last year',
                                data: lastYear,
                                borderColor: '#000000',
                                backgroundColor: 'transparent',
                                borderWidth: 2,
                                tension: 0.4,
                                pointRadius: 0,
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false },
                            tooltip: { enabled: true }
                        },
                        scales: {
                            x: { grid: { display: false } },
                            y: {
                                min: 0,
                                max: 20000,
                                ticks: {
                                    stepSize: 10000,
                                    callback: function(value) {
                                        if (value === 0) return '0';
                                        return (value / 1000) + 'K';
                                    }
                                },
                                grid: { color: 'rgba(0,0,0,0.06)' }
                            }
                        }
                    }
                });

                canvas.dataset.initialized = 'true';
            }

            function initCarRentalChart() {
                const canvas = document.getElementById('carRentalChart');
                if (!canvas || canvas.dataset.initialized === 'true' || typeof Chart === 'undefined') return;
                const ctx = canvas.getContext('2d');

                const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul'];
                const data = [12000, 19000, 15000, 18000, 24300, 16000, 14000];
                const highlightIndex = 4; // May (24300)

                new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: months,
                        datasets: [
                            {
                                label: 'Car Rentals',
                                data: data,
                                backgroundColor: function(context) {
                                    return context.dataIndex === highlightIndex ? '#336891' : '#E5E7EB';
                                },
                                borderRadius: 8,
                                borderSkipped: false,
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        indexAxis: 'x',
                        plugins: {
                            legend: { display: false },
                            tooltip: { enabled: true }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                display: false
                            },
                            x: {
                                grid: { display: false }
                            }
                        }
                    },
                    plugins: [
                        {
                            id: 'datalabels',
                            afterDatasetsDraw(chart) {
                                const ctx = chart.ctx;
                                const datasetMeta = chart.getDatasetMeta(0);
                                
                                datasetMeta.data.forEach((bar, index) => {
                                    if (index === highlightIndex) {
                                        const value = chart.data.datasets[0].data[index];
                                        const valueStr = value >= 1000 ? (value / 1000).toFixed(0) + 'K' : value;
                                        
                                        ctx.fillStyle = '#336891';
                                        ctx.font = 'bold 12px sans-serif';
                                        ctx.textAlign = 'center';
                                        ctx.textBaseline = 'bottom';
                                        ctx.fillText(valueStr, bar.x, bar.y - 10);
                                    }
                                });
                            }
                        }
                    ]
                });

                canvas.dataset.initialized = 'true';
            }

            function initHotelsBookingsChart() {
                const canvas = document.getElementById('hotelsBookingsChart');
                if (!canvas || canvas.dataset.initialized === 'true' || typeof Chart === 'undefined') return;
                const ctx = canvas.getContext('2d');

                const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'];
                const data = [14000, 16000, 12000, 15000, 24300, 18000];
                const highlightIndex = 4; // May (24300)

                new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: months,
                        datasets: [
                            {
                                label: 'Hotels Bookings',
                                data: data,
                                backgroundColor: function(context) {
                                    return context.dataIndex === highlightIndex ? '#336891' : '#E5E7EB';
                                },
                                borderRadius: 8,
                                borderSkipped: false,
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        indexAxis: 'x',
                        plugins: {
                            legend: { display: false },
                            tooltip: { enabled: true }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                display: false
                            },
                            x: {
                                grid: { display: false }
                            }
                        }
                    },
                    plugins: [
                        {
                            id: 'datalabels',
                            afterDatasetsDraw(chart) {
                                const ctx = chart.ctx;
                                const datasetMeta = chart.getDatasetMeta(0);
                                
                                datasetMeta.data.forEach((bar, index) => {
                                    if (index === highlightIndex) {
                                        const value = chart.data.datasets[0].data[index];
                                        const valueStr = value >= 1000 ? (value / 1000).toFixed(0) + 'K' : value;
                                        
                                        ctx.fillStyle = '#336891';
                                        ctx.font = 'bold 12px sans-serif';
                                        ctx.textAlign = 'center';
                                        ctx.textBaseline = 'bottom';
                                        ctx.fillText(valueStr, bar.x, bar.y - 10);
                                    }
                                });
                            }
                        }
                    ]
                });

                canvas.dataset.initialized = 'true';
            }

            // When HTMX swaps in the fragment, initialize the charts
            document.addEventListener('htmx:afterSwap', function(evt) {
                if (document.getElementById('activeBookingChart')) {
                    initActiveBookingChart();
                }
                if (document.getElementById('flightsChart')) {
                    initFlightsChart();
                }
                if (document.getElementById('carRentalChart')) {
                    initCarRentalChart();
                }
                if (document.getElementById('hotelsBookingsChart')) {
                    initHotelsBookingsChart();
                }
            });
        </script>
</body>
</html>
