<header class="flex justify-between p-4 border-b border-[#1D1D1D33]" >
  <div>
    <h1 class="text-4xl font-semibold">{{.Title}}</h1>
    <p class="opacity-60">{{.Subtitle}}</p>
  </div>
  <div class="flex gap-3 items-center">
    <div class="relative rounded-md" style="box-shadow: 0px 4px 4px 0px #0000001A;">
      <span class="absolute left-3 top-1/2 -translate-y-1/2">
        <svg class="w-4 h-4 text-[#7C8B9D]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
      </span>
      <input type="text" placeholder="Search..." class="border border-[#336891] rounded-md pl-9 pr-4 py-2 text-sm w-80 focus:outline-none focus:border-[#336891]" />
    </div>
    <button class="bg-[#336891] p-2 rounded w-10 h-10 flex items-center justify-center">
      <img src="/static/admin/images/notification.png" alt="" class="w-5 h-5" />
    </button>
    <button class="bg-[#336891] p-2 rounded w-10 h-10 flex items-center justify-center">
      <img src="/static/admin/images/settings.png" alt="" class="w-5 h-5" />
    </button>
    <button class="bg-[#336891] text-white px-4 py-2 h-10 rounded flex items-center gap-2 text-sm font-medium">
      <img src="/static/admin/images/export.png" alt="" class="w-4 h-4" />
      <span>Export</span>
    </button>
  </div>
</header>
