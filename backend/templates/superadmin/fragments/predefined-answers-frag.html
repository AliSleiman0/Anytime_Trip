<script>
  // Intercept HTMX confirmations and show SweetAlert2 instead of native confirm
  document.addEventListener('htmx:confirm', function(event) {
    // Prevent HTMX from using the native window.confirm
    event.preventDefault();

    const detail = event.detail || {};
    const elt = detail.elt || null;
    const question = elt ? (elt.getAttribute('hx-confirm') || 'Are you sure?') : 'Are you sure?';

    Swal.fire({
      title: 'Delete Answer',
      html: question,
      icon: 'warning',
      iconColor: '#D24124',
      showCancelButton: true,
      confirmButtonText: 'Delete content',
      cancelButtonText: 'Cancel',
      confirmButtonColor: '#D24124',
      cancelButtonColor: 'transparent',
      reverseButtons: true,
      customClass: {
        confirmButton: 'swal-confirm-btn',
        cancelButton: 'swal-cancel-btn',
        popup: 'swal-popup'
      }
    }).then((result) => {
      if (result.isConfirmed) {
        // Tell HTMX to proceed with the original request
        if (typeof detail.issueRequest === 'function') {
          detail.issueRequest(true);
        }
      } else {
        // Explicitly cancel if needed
        if (typeof detail.issueRequest === 'function') {
          detail.issueRequest(false);
        }
      }
    });
  });

  // Keyboard shortcut binding functionality
  let capturedKeys = [];
  let isCapturingShortcut = false;
  let currentAnswerId = null;
  let pressedKeys = new Set();

  function openShortcutBindingPopup(answerId, currentShortcut) {
    currentAnswerId = answerId;
    capturedKeys = [];
    pressedKeys.clear();
    isCapturingShortcut = true;
    
    Swal.fire({
      title: 'Enter a Key Bind',
      html: `
        <div class="text-center">
          <p class="text-gray-600 mb-4">Press two keys together to set as shortcut</p>
          <div id="captured-keys" class="text-2xl font-bold text-blue-600 min-h-[40px]">
            Waiting for input...
          </div>
          <p class="text-sm text-gray-500 mt-2">Current: ${currentShortcut || 'None'}</p>
        </div>
      `,
      showCancelButton: true,
      showConfirmButton: false,
      cancelButtonText: 'Cancel',
      cancelButtonColor: '#336891',
      customClass: {
        cancelButton: 'swal-cancel-btn',
        popup: 'swal-popup'
      },
      didOpen: () => {
        document.addEventListener('keydown', handleShortcutCapture, true);
        document.addEventListener('keyup', handleKeyRelease, true);
      },
      willClose: () => {
        document.removeEventListener('keydown', handleShortcutCapture, true);
        document.removeEventListener('keyup', handleKeyRelease, true);
        isCapturingShortcut = false;
        capturedKeys = [];
        pressedKeys.clear();
      }
    });
  }

  function handleKeyRelease(event) {
    if (!isCapturingShortcut) return;
    pressedKeys.clear();
  }

  function handleShortcutCapture(event) {
    if (!isCapturingShortcut) return;
    
    event.preventDefault();
    event.stopPropagation();
    
    // Ignore repeated keys
    if (event.repeat) return;
    
    // Build the shortcut string from currently pressed keys
    let shortcut = [];
    
    // Add modifier keys first
    if (event.ctrlKey) shortcut.push('Ctrl');
    if (event.altKey) shortcut.push('Alt');
    if (event.shiftKey) shortcut.push('Shift');
    if (event.metaKey) shortcut.push('Meta');
    
    // Don't capture modifier keys alone - wait for a regular key
    if (['Control', 'Alt', 'Shift', 'Meta'].includes(event.key)) {
      return;
    }
    
    // Add the main key
    let mainKey = '';
    if (event.key.length === 1) {
      mainKey = event.key.toUpperCase();
    } else if (event.code.startsWith('Digit')) {
      mainKey = event.code.replace('Digit', '');
    } else if (event.code.startsWith('Key')) {
      mainKey = event.code.replace('Key', '');
    } else if (event.code.startsWith('Arrow')) {
      mainKey = event.code.replace('Arrow', '');
    } else if (['Enter', 'Space', 'Tab', 'Escape', 'Backspace'].includes(event.key)) {
      mainKey = event.key;
    } else {
      mainKey = event.key;
    }
    
    shortcut.push(mainKey);
    
    // We need at least 2 components (modifier + key) to make a valid shortcut
    if (shortcut.length < 2) {
      document.getElementById('captured-keys').textContent = 'Please press a modifier key (Ctrl, Alt, Shift) + another key';
      return;
    }
    
    const shortcutString = shortcut.join(' + ');
    
    // Update display
    document.getElementById('captured-keys').textContent = shortcutString;
    
    // Save the shortcut after a short delay
    setTimeout(() => {
      if (isCapturingShortcut) {
        saveShortcut(currentAnswerId, shortcutString);
      }
    }, 300);
  }

  function saveShortcut(answerId, shortcut) {
    isCapturingShortcut = false; // Stop capturing immediately
    
    fetch(`/superadmin/predefined-answers/${answerId}/shortcut`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ shortcut: shortcut })
    })
    .then(response => {
      if (!response.ok) {
        throw new Error('Server responded with error');
      }
      return response.json();
    })
    .then(data => {
      if (data.success) {
        // Update the display
        const displayElement = document.getElementById(`shortcut-display-${answerId}`);
        if (displayElement) {
          displayElement.textContent = shortcut;
        }
        
        // Close the popup and show success
        Swal.close();
        Swal.fire({
          title: 'Success!',
          text: `Shortcut set to: ${shortcut}`,
          icon: 'success',
          timer: 2000,
          showConfirmButton: false
        });
      } else {
        Swal.fire({
          title: 'Error',
          text: 'Failed to save shortcut',
          icon: 'error'
        });
      }
    })
    .catch(error => {
      console.error('Error saving shortcut:', error);
      Swal.fire({
        title: 'Error',
        text: 'Failed to save shortcut',
        icon: 'error'
      });
    });
  }

  // Expose function globally for inline onclick
  window.openShortcutBindingPopup = openShortcutBindingPopup;

  // Use event delegation for dynamically loaded content
  document.addEventListener('click', function(e) {
    // Check if clicked element or its parent is the delete button
    const deleteBtn = e.target.closest('.delete-answer-btn');
    
    if (deleteBtn) {
      e.preventDefault();
      e.stopPropagation();
      
      const answerName = deleteBtn.getAttribute('data-answer-name');
      
      Swal.fire({
        title: 'Delete Answer',
        html: `Are you sure you want to delete <strong>${answerName}</strong>?<br>This change cannot be undone`,
        icon: 'warning',
        iconColor: '#D24124',
        showCancelButton: true,
        confirmButtonText: 'Delete content',
        cancelButtonText: 'Cancel',
        confirmButtonColor: '#D24124',
        cancelButtonColor: 'transparent',
        reverseButtons: true,
        customClass: {
          confirmButton: 'swal-confirm-btn',
          cancelButton: 'swal-cancel-btn',
          popup: 'swal-popup'
        }
      }).then((result) => {
        if (result.isConfirmed) {
          // Handle delete action here
          console.log('Deleting:', answerName);
          // Add your delete logic here
        }
      });
    }
  });
</script>
