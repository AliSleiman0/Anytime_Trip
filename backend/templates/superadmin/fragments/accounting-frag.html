<script>
  // Initialize the Revenue chart when the fragment is swapped into the DOM
  function initRevenueChart() {
    const canvas = document.getElementById("revenueChart");
    if (!canvas || canvas.revenueChartInstance || typeof Chart === "undefined") {
      return;
    }
    
    const ctx = canvas.getContext("2d");

    const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul"];
    const thisYear = [15000, 18000, 22000, 20000, 28000, 35000, 42000];
    const lastYear = [12000, 14000, 16000, 18000, 20000, 22000, 24000];

    canvas.revenueChartInstance = new Chart(ctx, {
      type: "line",
      data: {
        labels: months,
        datasets: [
          {
            label: "Last year",
            data: lastYear,
            borderColor: "#000000",
            backgroundColor: "rgba(0, 0, 0, 0.05)",
            borderWidth: 2,
            tension: 0.4,
            pointRadius: 4,
            pointBackgroundColor: "#000000",
            pointBorderColor: "#fff",
            pointBorderWidth: 2,
            fill: true,
            borderDash: [6, 4],
          },
          {
            label: "This year",
            data: thisYear,
            borderColor: "#336891",
            backgroundColor: "rgba(51, 104, 145, 0.05)",
            borderWidth: 2,
            tension: 0.4,
            pointRadius: 4,
            pointBackgroundColor: "#336891",
            pointBorderColor: "#fff",
            pointBorderWidth: 2,
            fill: true,
          },
        ],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: {
          mode: "index",
          intersect: false,
        },
        plugins: {
          legend: { display: false },
          tooltip: { 
            enabled: true,
            backgroundColor: "rgba(0, 0, 0, 0.8)",
            padding: 12,
            borderRadius: 8,
            titleFont: { size: 12, weight: "bold" },
            bodyFont: { size: 11 },
            callbacks: {
              label: function(context) {
                return context.dataset.label + ": $" + context.parsed.y.toLocaleString();
              }
            }
          },
        },
        scales: {
          x: {
            grid: { display: false, drawBorder: false },
            ticks: { color: "#6B7280" },
          },
          y: {
            beginAtZero: true,
            min: 0,
            max: 50000,
            ticks: {
              stepSize: 10000,
              color: "#6B7280",
              callback: function (value) {
                if (value === 0) return "0";
                return "$" + (value / 1000).toFixed(0) + "K";
              },
            },
            grid: {
              color: "rgba(0, 0, 0, 0.06)",
              drawBorder: false,
            },
          },
        },
      },
    });
  }

  function initPieChart() {
    const canvas = document.getElementById("pieChart");
    if (!canvas || canvas.pieChartInstance || typeof Chart === "undefined") {
      return;
    }
    
    const ctx = canvas.getContext("2d");

    canvas.pieChartInstance = new Chart(ctx, {
      type: "doughnut",
      data: {
        labels: ["Cars", "Hotels", "Flights", "Other"],
        datasets: [
          {
            data: [30, 25, 35, 10],
            backgroundColor: [
              "#EF4444",
              "#10B981",
              "#F59E0B",
              "#3B82F6",
            ],
            borderColor: "#FFFFFF",
            borderWidth: 3,
          },
        ],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            enabled: true,
            backgroundColor: "rgba(0, 0, 0, 0.8)",
            padding: 12,
            borderRadius: 8,
            callbacks: {
              label: function(context) {
                return context.label + ": " + context.parsed + "%";
              }
            }
          },
        },
      },
    });
  }

  function initCarRentalChart() {
    const canvas = document.getElementById("carRentalChart");
    if (
      !canvas ||
      canvas.dataset.initialized === "true" ||
      typeof Chart === "undefined"
    )
      return;
    const ctx = canvas.getContext("2d");

    const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul"];
    const data = [12000, 19000, 15000, 18000, 24300, 16000, 14000];
    const highlightIndex = 4; // May (24300)

    new Chart(ctx, {
      type: "bar",
      data: {
        labels: months,
        datasets: [
          {
            label: "Car Rentals",
            data: data,
            backgroundColor: function (context) {
              return context.dataIndex === highlightIndex
                ? "#336891"
                : "#E5E7EB";
            },
            borderRadius: 8,
            borderSkipped: false,
          },
        ],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        indexAxis: "x",
        plugins: {
          legend: { display: false },
          tooltip: { enabled: true },
        },
        scales: {
          y: {
            beginAtZero: true,
            display: false,
          },
          x: {
            grid: { display: false },
          },
        },
      },
      plugins: [
        {
          id: "datalabels",
          afterDatasetsDraw(chart) {
            const ctx = chart.ctx;
            const datasetMeta = chart.getDatasetMeta(0);

            datasetMeta.data.forEach((bar, index) => {
              if (index === highlightIndex) {
                const value = chart.data.datasets[0].data[index];
                const valueStr =
                  value >= 1000 ? (value / 1000).toFixed(0) + "K" : value;

                ctx.fillStyle = "#336891";
                ctx.font = "bold 12px sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "bottom";
                ctx.fillText(valueStr, bar.x, bar.y - 10);
              }
            });
          },
        },
      ],
    });

    canvas.dataset.initialized = "true";
  }

  function initHotelsBookingsChart() {
    const canvas = document.getElementById("hotelsBookingsChart");
    if (
      !canvas ||
      canvas.dataset.initialized === "true" ||
      typeof Chart === "undefined"
    )
      return;
    const ctx = canvas.getContext("2d");

    const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun"];
    const data = [14000, 16000, 12000, 15000, 24300, 18000];
    const highlightIndex = 4; // May (24300)

    new Chart(ctx, {
      type: "bar",
      data: {
        labels: months,
        datasets: [
          {
            label: "Hotels Bookings",
            data: data,
            backgroundColor: function (context) {
              return context.dataIndex === highlightIndex
                ? "#336891"
                : "#E5E7EB";
            },
            borderRadius: 8,
            borderSkipped: false,
          },
        ],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        indexAxis: "x",
        plugins: {
          legend: { display: false },
          tooltip: { enabled: true },
        },
        scales: {
          y: {
            beginAtZero: true,
            display: false,
          },
          x: {
            grid: { display: false },
          },
        },
      },
      plugins: [
        {
          id: "datalabels",
          afterDatasetsDraw(chart) {
            const ctx = chart.ctx;
            const datasetMeta = chart.getDatasetMeta(0);

            datasetMeta.data.forEach((bar, index) => {
              if (index === highlightIndex) {
                const value = chart.data.datasets[0].data[index];
                const valueStr =
                  value >= 1000 ? (value / 1000).toFixed(0) + "K" : value;

                ctx.fillStyle = "#336891";
                ctx.font = "bold 12px sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "bottom";
                ctx.fillText(valueStr, bar.x, bar.y - 10);
              }
            });
          },
        },
      ],
    });

    canvas.dataset.initialized = "true";
  }

  // When HTMX swaps in the fragment, initialize the charts
  document.addEventListener("htmx:afterSwap", function (evt) {
    setTimeout(function() {
      if (document.getElementById("revenueChart")) {
        initRevenueChart();
      }
      if (document.getElementById("pieChart")) {
        initPieChart();
      }
      if (document.getElementById("carRentalChart")) {
        initCarRentalChart();
      }
      if (document.getElementById("hotelsBookingsChart")) {
        initHotelsBookingsChart();
      }
    }, 100);
  });

  // Also initialize on page load
  document.addEventListener("DOMContentLoaded", function() {
    setTimeout(function() {
      if (document.getElementById("revenueChart")) {
        initRevenueChart();
      }
      if (document.getElementById("pieChart")) {
        initPieChart();
      }
      if (document.getElementById("carRentalChart")) {
        initCarRentalChart();
      }
      if (document.getElementById("hotelsBookingsChart")) {
        initHotelsBookingsChart();
      }
    }, 100);
  });
</script>
