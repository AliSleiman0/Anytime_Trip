run:
  timeout: 5m
  skip-dirs:
    - scripts
    - seeds
    - tmp
    - build
  skip-files:
    - ".*_test.go"

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused

issues:
  exclude-rules:
    - path: scripts/
      linters:
        - typecheck
        - unused
        - deadcode
